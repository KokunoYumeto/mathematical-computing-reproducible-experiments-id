 <title>Jarak terukur dan model gerak berkecepatan tetap</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Jarak terukur dan model gerak berkecepatan tetap</dc:title>
    <dc:description>Grafik garis dan titik untuk tujuh pengamatan pada waktu 0 sampai 6 detik. Sumbu mendatar menyatakan waktu dalam detik dan sumbu tegak menyatakan jarak dalam meter, keduanya dimulai dari nol. Titik lingkaran menunjukkan jarak terukur 1,0; 3,1; 4,8; 7,2; 9,0; 10,9; dan 13,1 meter, masing-masing dengan batang ketidakpastian plus-minus 0,4 meter. Garis putus-putus menunjukkan model d sama dengan 2t plus 1; seluruh nilai model berada di dalam interval ketidakpastian pengamatan.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>O002</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
